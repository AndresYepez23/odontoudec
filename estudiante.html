et/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient("https://jqbrheonqqsiijrprsqs.supabase.co","sb_publishable_bXfNGlIlersAhrUNR99wlA_golwgRC8");const $=id=>document.getElementById(id);const id=new URLSearchParams(location.search).get("id");const safe=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));(async()=>{if(!id){$("status").textContent="No se indicó el perfil que quieres consultar.";return;}const {data,error}=await db.from("profiles").select("id,display_name,semester,public_id,bio,profile_visibility").eq("id",id).maybeSingle();if(error||!data){$("status").textContent="No encontramos este perfil o su propietario decidió mantenerlo privado.";return;}if(data.profile_visibility==="private"){const {data:{session}}=await db.auth.getSession();if(session?.user?.id!==data.id){$("status").textContent="Este estudiante mantiene su perfil privado.";return;}}$("status").hidden=true;$("profile").hidden=false;$("name").textContent=data.display_name||"Estudiante";$("avatar").textContent=(data.display_name||"O").trim().charAt(0).toLocaleUpperCase("es");$("meta").textContent=[data.semester?"Semestre "+data.semester:null,data.public_id?"ID "+data.public_id:null].filter(Boolean).join(" · ");$("bio").textContent=data.bio||"Este estudiante todavía no ha añadido una presentación."; $("message").href="mensajes.html?student="+encodeURIComponent(data.id);})();</script><script src="assets/community-dock.js"></script><script src="/assets/posthog.js" defer></script>
